name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: gofmt
        run: make fmt

      - name: vet
        run: make vet

      # The live suites are behind the e2e build tag, so `go build ./...` and
      # `go test ./...` never compile them — a change to ResolveGGUF's return
      # type broke that suite and passed every other gate here. vet compiles
      # them and runs nothing, so this still rents nothing.
      - name: vet (e2e build tag)
        run: make vet-e2e

      - name: SPDX headers
        run: make headers

      - name: Maximum tracked file size
        run: make file-size

      - name: test
        run: make test

      - name: race
        run: make race

      # NFR-09: no test may issue a real create. Provider credentials are not
      # available to CI, so a test that tried would fail rather than spend —
      # but the e2e build tag is the deliberate path and it is never on here.
      - name: no e2e in the default suite
        run: |
          if go test -run 'TestE2E' -list '.*' ./... 2>/dev/null | grep -q TestE2E; then
            echo "e2e tests must be behind the 'e2e' build tag"; exit 1
          fi

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # NFR-06: a single static binary with no runtime dependencies.
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags '-s -w' -o /dev/null ./cmd/larri

  # Keep the branch rule stable when the checks above are split or renamed.
  required:
    if: ${{ always() }}
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$CHECK_RESULT" != "success" || "$BUILD_RESULT" != "success" ]]; then
            printf 'check=%s build=%s\n' "$CHECK_RESULT" "$BUILD_RESULT"
            exit 1
          fi
